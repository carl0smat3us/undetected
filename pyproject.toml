[project]
name = "undetected-updated"
version = "1.0.2"
description = "Selenium Chrome drop-in with chromedriver patching and automatic page-level JS injection."
authors = [
    { name = "lovebrownie", email = "91576261+lovebrownie@users.noreply.github.com" },
    { name = "dornech", email = "dornech@gmx.de" }
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "selenium>=4.39.0,<5.0.0",
    "requests>=2.32.3,<3.0.0",
    "websockets>=15.0,<16.0.0",
    "packaging>=24.0",
]

[project.urls]
Homepage = "https://github.com/dornech/undetected"
Issues = "https://github.com/dornech/undetected/issues"
Repository = "https://github.com/dornech/undetected"

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "ruff>=0.14.0,<0.15.0",
    "taskipy>=1.14.1",
]

[build-system]
requires = ["flit_core >=3.11,<5"]
build-backend = "flit_core.buildapi"
# requires = ["hatchling"]
# build-backend = "hatchling.build"

[tool.flit.module]
name = "undetected"

[tool.hatch.build]
packages = ["undetected"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E722"]

[tool.ruff.lint.isort]
known-first-party = ["undetected"]

[tool.ruff.lint.per-file-ignores]
"undetected/reactor.py" = ["F821"]
"undetected/cdp.py" = ["F821"]

[tool.taskipy.tasks]
lint = "ruff format undetected/ tests/ && ruff check --fix undetected/ tests/"
lint-check = "ruff format --check undetected/ tests/ && ruff check undetected/ tests/"
test = "pytest tests/test_basic.py tests/test_multiproc.py -q"
test-browser = "pytest tests/detection/ -q"
